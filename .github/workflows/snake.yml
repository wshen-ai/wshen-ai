# 生成贡献贪吃蛇，推送到 output 分支
# README 底部引用的就是这个分支里的 SVG——没有这个 workflow，那张图是 404。
# 不需要可以整个文件删掉，同时删掉 README 里最后那张 snake 图即可。

name: Contribution Snake

on:
  schedule:
    # 每天 UTC 16:00（北京时间次日 00:00）刷新一次
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 吐纳 · generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg?palette=github-light
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 化形 · push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
